<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026: SUPER OVER ANIMATED</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --team-color: #00f2ff; /* Default */
            --stadium-glow: rgba(0, 242, 255, 0.2);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #020617;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: 95vh;
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
            border: 3px solid var(--team-color);
            border-radius: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px var(--stadium-glow);
        }

        /* TEAM SELECTION OVERLAY */
        #team-overlay {
            position: absolute;
            inset: 0;
            background: #020617;
            z-index: 100;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            overflow-y: auto;
            border-radius: 40px;
        }

        .team-card {
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            font-family: 'Orbitron';
            transition: 0.3s;
        }

        .team-card:hover { transform: scale(1.05); }

        /* HEADER */
        .scoreboard {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border-bottom: 2px solid var(--team-color);
            border-radius: 40px 40px 0 0;
        }

        .score-big { font-family: 'Orbitron'; font-size: 2rem; color: var(--team-color); }

        /* STADIUM AREA */
        .stadium {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #166534 0%, #064e3b 100%);
            margin: 15px;
            border-radius: 20px;
            overflow: hidden;
            perspective: 800px;
        }

        .pitch {
            width: 120px;
            height: 100%;
            background: #94a3b8;
            margin: 0 auto;
            transform: rotateX(40deg);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
            border-left: 2px solid white;
            border-right: 2px solid white;
        }

        /* ANIMATED ELEMENTS */
        #ball {
            position: absolute;
            width: 18px;
            height: 18px;
            background: radial-gradient(circle at 30%, #fff, #ef4444);
            border-radius: 50%;
            left: 50%;
            top: 10%;
            transform: translateX(-50%);
            display: none;
            z-index: 10;
        }

        #bat {
            position: absolute;
            bottom: 15%;
            left: 50%;
            font-size: 50px;
            transform: translateX(-50%) rotate(0deg);
            transform-origin: bottom center;
            z-index: 15;
            transition: 0.1s;
        }

        /* ANIMATIONS */
        @keyframes bowlAction {
            0% { top: 10%; transform: translateX(-50%) scale(0.6); }
            100% { top: 80%; transform: translateX(-50%) scale(1.1); }
        }

        @keyframes batSwing {
            0% { transform: translateX(-50%) rotate(0deg); }
            50% { transform: translateX(-50%) rotate(-60deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }

        @keyframes ballHit {
            0% { top: 80%; transform: translateX(-50%); }
            100% { top: -20%; transform: translateX(-150%) scale(0.2); }
        }

        .swing { animation: batSwing 0.3s ease-in-out; }
        .bowling { display: block !important; animation: bowlAction 0.6s linear forwards; }
        .hitted { animation: ballHit 0.6s ease-out forwards !important; }

        /* OVER TRACKER */
        .balls-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px;
        }
        .dot { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #334155; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
        .dot-filled { background: var(--team-color); color: black; border-color: white; }

        /* CONTROLS */
        .controls {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .num-btn {
            background: #1e293b;
            border: 2px solid var(--team-color);
            color: white;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 15px;
            font-family: 'Orbitron';
            cursor: pointer;
        }
        .num-btn:active { transform: scale(0.9); }

        .result-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron';
            font-size: 4rem;
            text-shadow: 0 0 20px black;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- TEAM SELECTION -->
    <div id="team-overlay">
        <div style="grid-column: span 2; text-align: center;">
            <h1 style="font-family: 'Orbitron'; color: #00f2ff;">IPL 2026 SUPER OVER</h1>
            <p>CHOOSE YOUR TEAM</p>
        </div>
        <div class="team-card" style="background: #eab308; color: black;" onclick="selectTeam('CSK', '#eab308')">CSK</div>
        <div class="team-card" style="background: #1d4ed8; color: white;" onclick="selectTeam('DC', '#1d4ed8')">DC</div>
        <div class="team-card" style="background: #0f172a; color: #00f2ff; border: 1px solid #00f2ff;" onclick="selectTeam('GT', '#00f2ff')">GT</div>
        <div class="team-card" style="background: #581c87; color: white;" onclick="selectTeam('KKR', '#a855f7')">KKR</div>
        <div class="team-card" style="background: #64748b; color: white;" onclick="selectTeam('LSG', '#94a3b8')">LSG</div>
        <div class="team-card" style="background: #0ea5e9; color: white;" onclick="selectTeam('MI', '#0ea5e9')">MI</div>
        <div class="team-card" style="background: #ef4444; color: white;" onclick="selectTeam('PBKS', '#ef4444')">PBKS</div>
        <div class="team-card" style="background: #db2777; color: white;" onclick="selectTeam('RR', '#db2777')">RR</div>
        <div class="team-card" style="background: #16a34a; color: white;" onclick="selectTeam('RCB', '#16a34a')">RCB</div>
        <div class="team-card" style="background: #f97316; color: white;" onclick="selectTeam('SRH', '#f97316')">SRH</div>
    </div>

    <!-- HEADER -->
    <div class="scoreboard">
        <div>
            <div id="display-team-name" style="font-weight: bold; letter-spacing: 1px;">TEAM</div>
            <div id="score" class="score-big">0/0</div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 0.8rem; opacity: 0.7;">TARGET</div>
            <div id="target" class="score-big" style="font-size: 1.5rem;">--</div>
        </div>
    </div>

    <!-- OVER TRACKER -->
    <div class="balls-row" id="tracker">
        <div class="dot">1</div>
        <div class="dot">2</div>
        <div class="dot">3</div>
        <div class="dot">4</div>
        <div class="dot">5</div>
        <div class="dot">6</div>
    </div>

    <!-- STADIUM -->
    <div class="stadium">
        <div id="popup" class="result-popup">6!</div>
        <div class="pitch"></div>
        <div id="ball"></div>
        <div id="bat">🏏</div>
    </div>

    <div id="status" style="text-align: center; color: var(--team-color); font-weight: bold; margin-bottom: 5px;">YOU ARE BATTING</div>

    <!-- CONTROLS -->
    <div class="controls">
        <button class="num-btn" onclick="play(1)">1</button>
        <button class="num-btn" onclick="play(2)">2</button>
        <button class="num-btn" onclick="play(3)">3</button>
        <button class="num-btn" onclick="play(4)">4</button>
        <button class="num-btn" onclick="play(5)">5</button>
        <button class="num-btn" onclick="play(6)">6</button>
    </div>
</div>

<script>
    let score = 0, wickets = 0, balls = 0, target = null, isUserBatting = true, locked = false;

    function selectTeam(name, color) {
        document.documentElement.style.setProperty('--team-color', color);
        document.documentElement.style.setProperty('--stadium-glow', color + '44');
        document.getElementById('display-team-name').innerText = name;
        document.getElementById('team-overlay').style.display = 'none';
    }

    function play(userNum) {
        if(locked || balls >= 6) return;
        locked = true;

        const cpuNum = Math.floor(Math.random() * 6) + 1;
        const ball = document.getElementById('ball');
        const bat = document.getElementById('bat');
        const popup = document.getElementById('popup');

        // 1. Bowl Ball
        ball.className = 'bowling';
        
        setTimeout(() => {
            // 2. Swing Bat
            bat.classList.add('swing');

            setTimeout(() => {
                // 3. Collision Logic
                if(userNum === cpuNum) {
                    // OUT
                    popup.innerText = "OUT!";
                    popup.style.color = "#ff0055";
                    wickets = 1;
                    updateTracker('W');
                } else {
                    // RUNS
                    let runs = isUserBatting ? userNum : cpuNum;
                    score += runs;
                    popup.innerText = runs;
                    popup.style.color = "white";
                    ball.classList.add('hitted');
                    updateTracker(runs);
                }

                popup.style.display = 'block';
                document.getElementById('score').innerText = `${score}/${wickets}`;

                setTimeout(() => {
                    popup.style.display = 'none';
                    ball.className = '';
                    bat.classList.remove('swing');
                    balls++;
                    locked = false;
                    checkInnings();
                }, 800);

            }, 200);
        }, 400);
    }

    function updateTracker(val) {
        const dots = document.querySelectorAll('.dot');
        dots[balls].innerText = val;
        dots[balls].classList.add('dot-filled');
    }

    function checkInnings() {
        if(!isUserBatting && (score >= target || balls >= 6 || wickets >= 1)) {
            endGame();
            return;
        }

        if(isUserBatting && (balls >= 6 || wickets >= 1)) {
            target = score + 1;
            alert("Innings Over! CPU needs " + target + " to win.");
            isUserBatting = false;
            score = 0; wickets = 0; balls = 0;
            document.getElementById('score').innerText = "0/0";
            document.getElementById('target').innerText = target;
            document.getElementById('status').innerText = "YOU ARE BOWLING";
            document.querySelectorAll('.dot').forEach(d => {
                d.classList.remove('dot-filled');
                d.innerText = Array.from(d.parentNode.children).indexOf(d) + 1;
            });
        }
    }

    function endGame() {
        let msg = "";
        if(score >= target) {
            msg = isUserBatting ? "YOU WON! 🎉" : "CPU WON! 🤖";
        } else {
            msg = isUserBatting ? "CPU WON! 🤖" : "YOU WON! 🎉";
        }
        alert(msg);
        location.reload();
    }
</script>

</body>
</html>
