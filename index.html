<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026: SUPER OVER PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ipl-gold: #f39c12;
            --ipl-blue: #004ba0;
            --ipl-neon: #00f2ff;
            --ipl-pink: #ff0055;
            --grass: #064e3b;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #020617;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-wrapper {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--ipl-neon);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
        }

        /* Stadium Header */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(to bottom, #004ba0, transparent);
            border-radius: 30px 30px 0 0;
        }

        .score-box { text-align: center; }
        .score-val { font-family: 'Orbitron'; font-size: 2rem; color: var(--ipl-gold); }
        .target-tag { color: var(--ipl-neon); font-size: 0.8rem; }

        /* Over Tracker */
        .over-tracker {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
        }
        .ball-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #1e293b;
            border: 1px solid #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        .ball-active { border-color: var(--ipl-gold); box-shadow: 0 0 10px var(--ipl-gold); }

        /* The 3D Pitch Area */
        .stadium {
            flex-grow: 1;
            position: relative;
            perspective: 1000px;
            overflow: hidden;
            background: linear-gradient(to bottom, #020617, #064e3b);
        }

        .pitch {
            width: 150px;
            height: 300px;
            background: #1e3a8a;
            margin: 0 auto;
            transform: rotateX(60deg);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.3);
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
        }

        /* The Ball Animation */
        .ball {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30%, #fff, #ff0055);
            border-radius: 50%;
            position: absolute;
            left: 50%;
            bottom: 20%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px #ff0055;
            display: none;
            z-index: 10;
        }

        @keyframes bowlBall {
            0% { bottom: 80%; transform: translateX(-50%) scale(0.5); opacity: 1; }
            50% { bottom: 40%; transform: translateX(-50%) scale(1.2); }
            100% { bottom: 10%; transform: translateX(-50%) scale(1); opacity: 0; }
        }

        .bowling { display: block; animation: bowlBall 0.8s linear forwards; }

        /* Batting Action Visual */
        .result-overlay {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-family: 'Orbitron';
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 0 0 20px black;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
        }

        .show-result { animation: popResult 0.8s ease-out; }
        @keyframes popResult {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Control Panel */
        .controls {
            padding: 20px;
            background: #0f172a;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            border-radius: 0 0 30px 30px;
        }

        .btn {
            background: #1e293b;
            border: 2px solid var(--ipl-blue);
            color: white;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 15px;
            font-family: 'Orbitron';
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover:not(:disabled) { background: var(--ipl-blue); border-color: var(--ipl-neon); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .team-selection {
            position: absolute;
            inset: 0;
            background: #020617;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 30px;
        }

    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- Team Selection Overlay -->
    <div id="team-screen" class="team-selection">
        <h1 style="font-family: 'Orbitron'; color: var(--ipl-neon);">IPL 2026</h1>
        <h3>SELECT YOUR FRANCHISE</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" onclick="initGame('MI')">MI</button>
            <button class="btn" onclick="initGame('CSK')">CSK</button>
            <button class="btn" onclick="initGame('RCB')">RCB</button>
            <button class="btn" onclick="initGame('GT')">GT</button>
        </div>
    </div>

    <!-- Header Stats -->
    <div class="header">
        <div class="score-box">
            <div class="label" id="team-label">TEAM</div>
            <div id="score" class="score-val">0/0</div>
        </div>
        <div class="score-box">
            <div class="target-tag" id="innings-tag">1st INNINGS</div>
            <div class="label">TARGET: <span id="target-ui">--</span></div>
        </div>
    </div>

    <!-- Over Tracker -->
    <div class="over-tracker" id="over-ui">
        <div class="ball-dot">1</div>
        <div class="ball-dot">2</div>
        <div class="ball-dot">3</div>
        <div class="ball-dot">4</div>
        <div class="ball-dot">5</div>
        <div class="ball-dot">6</div>
    </div>

    <!-- 3D Pitch -->
    <div class="stadium">
        <div class="result-overlay" id="flash-text">6!</div>
        <div class="pitch">
            <!-- Wickets -->
            <div style="position: absolute; top: 5%; left: 45%; display: flex; gap: 4px;">
                <div style="width: 4px; height: 30px; background: gold;"></div>
                <div style="width: 4px; height: 30px; background: gold;"></div>
                <div style="width: 4px; height: 30px; background: gold;"></div>
            </div>
            <!-- Ball -->
            <div id="game-ball" class="ball"></div>
        </div>
    </div>

    <div style="text-align: center; padding: 5px; font-weight: bold; color: var(--ipl-gold)" id="status-msg">
        YOUR TURN TO BAT
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn" onclick="handlePlay(1)">1</button>
        <button class="btn" onclick="handlePlay(2)">2</button>
        <button class="btn" onclick="handlePlay(3)">3</button>
        <button class="btn" onclick="handlePlay(4)">4</button>
        <button class="btn" onclick="handlePlay(5)">5</button>
        <button class="btn" onclick="handlePlay(6)">6</button>
    </div>
</div>

<script>
    let score = 0;
    let wickets = 0;
    let ballsPlayed = 0;
    let target = null;
    let isUserBatting = true;
    let gameLocked = false;
    let myTeam = "";

    function initGame(team) {
        myTeam = team;
        document.getElementById('team-label').innerText = team;
        document.getElementById('team-screen').style.display = 'none';
    }

    function handlePlay(userNum) {
        if(gameLocked || ballsPlayed >= 6) return;

        gameLocked = true;
        const cpuNum = Math.floor(Math.random() * 6) + 1;
        const ball = document.getElementById('game-ball');
        const flash = document.getElementById('flash-text');
        const status = document.getElementById('status-msg');

        // Start Bowling Animation
        ball.className = 'ball bowling';
        
        setTimeout(() => {
            // Result logic triggered when ball "hits" the bat
            if (userNum === cpuNum) {
                // OUT
                flash.innerText = "WICKET!";
                flash.style.color = "var(--ipl-pink)";
                wickets = 1;
                updateOverTracker("W");
            } else {
                // RUNS
                let runs = isUserBatting ? userNum : cpuNum;
                score += runs;
                flash.innerText = runs;
                flash.style.color = "var(--ipl-neon)";
                updateOverTracker(runs);
            }

            flash.className = 'result-overlay show-result';
            document.getElementById('score').innerText = `${score}/${wickets}`;
            
            // Cleanup for next ball
            setTimeout(() => {
                ball.className = 'ball';
                flash.className = 'result-overlay';
                ballsPlayed++;
                gameLocked = false;
                
                checkInningsOver();
            }, 800);

        }, 400);
    }

    function updateOverTracker(val) {
        const dots = document.querySelectorAll('.ball-dot');
        dots[ballsPlayed].innerText = val;
        dots[ballsPlayed].classList.add('ball-active');
    }

    function checkInningsOver() {
        // Chase Logic
        if(!isUserBatting && (score >= target || ballsPlayed >= 6 || wickets >= 1)) {
            endGame();
            return;
        }

        // First Innings Logic
        if(isUserBatting && (ballsPlayed >= 6 || wickets >= 1)) {
            target = score + 1;
            alert(`Innings Over! Target for CPU: ${target}`);
            resetForSecondInnings();
        }
    }

    function resetForSecondInnings() {
        score = 0;
        wickets = 0;
        ballsPlayed = 0;
        isUserBatting = false;
        document.getElementById('score').innerText = "0/0";
        document.getElementById('target-ui').innerText = target;
        document.getElementById('innings-tag').innerText = "2nd INNINGS";
        document.getElementById('status-msg').innerText = "YOU ARE BOWLING!";
        
        const dots = document.querySelectorAll('.ball-dot');
        dots.forEach(d => {
            d.innerText = d.getAttribute('data-idx'); // reset labels
            d.classList.remove('ball-active');
            d.innerText = Array.from(dots).indexOf(d) + 1;
        });
    }

    function endGame() {
        gameLocked = true;
        let finalMsg = "";
        if (score >= target) {
            finalMsg = isUserBatting ? "YOU WON! 🎉" : "CPU WON! 🤖";
        } else {
            finalMsg = isUserBatting ? "CPU WON! 🤖" : "YOU WON! 🎉";
        }
        
        document.getElementById('status-msg').innerText = "GAME OVER";
        setTimeout(() => {
            alert(finalMsg);
            location.reload();
        }, 500);
    }
</script>

</body>
</html>
